name: Publish knowledge base

on:
  workflow_call:
    inputs:
      site_url:
        type: string
        required: false

permissions:
  pages: write
  id-token: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download built site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages-artifact
      - name: Verify Pages archive
        run: test -s "$RUNNER_TEMP/pages-artifact/artifact.tar"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          timeout: 60000
      - name: Report deployment status
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOYMENT_OUTCOME: ${{ steps.deployment.outcome }}
          SITE_URL: ${{ steps.deployment.outputs.page_url || inputs.site_url }}
        run: |
          status=failed
          if [[ "$DEPLOYMENT_OUTCOME" == "success" ]]; then
            status=succeeded
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$(date -u +%F) - Deployment: $status" \
            --body "URL: $SITE_URL"
